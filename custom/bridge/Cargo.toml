[package]
name = "custom-bridge"
description = "[CUSTOM] The adapter layer: the only custom crate that knows SolidCraft's internals"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# UI settings (toolbar tabs, product name). Only the desktop app turns it on; the CLI stays headless.
ui = ["dep:solidcraft-ui-egui", "dep:egui"]

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-ui-egui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde_json = { workspace = true }
