[package]
name = "custom-features"
description = "[CUSTOM] Your own features. Depends ONLY on custom-bridge, never on solidcraft-* crates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Desktop UI settings (toolbar tabs, product name); turned on by apps/solidcraft only.
ui = ["custom-bridge/ui", "dep:memory-stats"]

[dependencies]
custom-bridge = { path = "../bridge" }
# Agent protocol (JSON lines); workspace version, the same SolidCraft uses
serde_json = { workspace = true }
# SDF text in the 3D view (src/sdf.rs): glyph outlines and egui's default fonts (not SolidCraft crates)
ttf-parser = { workspace = true }
epaint_default_fonts = "0.37"
# RAM in the status bar (not a SolidCraft crate, so allowed here; see rules/01-layering.md)
memory-stats = { version = "1", optional = true }
