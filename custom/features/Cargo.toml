[package]
name = "custom-features"
description = "[CUSTOM] Your own features. Depends ONLY on custom-bridge, never on solidcraft-* crates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Desktop UI settings (toolbar tabs, product name); turned on by apps/solidcraft only.
ui = ["custom-bridge/ui"]

[dependencies]
custom-bridge = { path = "../bridge" }
